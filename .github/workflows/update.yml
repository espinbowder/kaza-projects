# Rebuilds the public data (docs/data) from the starting data + approved KoboToolbox submissions.
# Runs every day at 03:17 UTC, and whenever someone presses "Run workflow" on the Actions tab.
name: Update KAZA projects data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write          # lets the workflow save the new data files back into the repository

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v5
        with:
          ref: main        # always the latest version, also when an older run is re-run
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install numpy
        run: pip install numpy

      - name: Rebuild the data
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
        run: python scripts/update.py

      - name: Save the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data reports
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update project data $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main  
            git push
          fi
